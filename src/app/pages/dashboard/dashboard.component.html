<div class="dashboard-wrapper">
  <!-- Top Navigation Header -->
  <app-dashboard-header></app-dashboard-header>

  <div class="dashboard-layout">
    <!-- Cyber Sidebar Navigation -->
    <app-dashboard-sidebar></app-dashboard-sidebar>

    <!-- Main Content Viewport -->
    <main class="dashboard-viewport">
      <!-- Administrative Action Toast Alert -->
      <div class="toast-alert admin-toast" *ngIf="adminActionNotice()">
        <span class="toast-icon">🛡️</span>
        <div class="toast-message">
          <strong>Directory Notice:</strong> {{ adminActionNotice() }}
        </div>
      </div>

      <!-- SSO Launching Alert Banner -->
      <div class="toast-alert sso-toast" *ngIf="ssoLaunchingNotice()">
        <span class="toast-icon">⚡</span>
        <div class="toast-message">
          <strong>Single Sign-On Active:</strong> {{ ssoLaunchingNotice() }}
        </div>
      </div>

      <!-- Session Revocation Toast Alert -->
      <div class="toast-alert" *ngIf="sessionRevoked()">
        <span class="toast-icon">🛡️</span>
        <div class="toast-message">
          <strong>Sessions Terminated:</strong> All active tokens and sessions on secondary devices have been revoked.
        </div>
      </div>

      <!-- ====================================================================
           VIEW 1: ADMIN CONSOLE
           ==================================================================== -->
      <div *ngIf="viewMode() === 'admin'">
        <app-admin-overview *ngIf="activeTab() === 'overview'"></app-admin-overview>
        <app-admin-directory *ngIf="activeTab() === 'directory'"></app-admin-directory>
        <app-admin-saml-oidc *ngIf="activeTab() === 'saml-oidc'"></app-admin-saml-oidc>
        <app-admin-cloud-ldap *ngIf="activeTab() === 'cloud-ldap'"></app-admin-cloud-ldap>
        <app-admin-cloud-radius *ngIf="activeTab() === 'cloud-radius'"></app-admin-cloud-radius>
        <app-admin-audit-logs *ngIf="activeTab() === 'audit-logs'"></app-admin-audit-logs>
        <app-admin-device-fleet *ngIf="activeTab() === 'device-fleet'"></app-admin-device-fleet>
        <app-admin-settings *ngIf="activeTab() === 'settings'"></app-admin-settings>
      </div>

      <!-- ====================================================================
           VIEW 2: USER PORTAL
           ==================================================================== -->
      <div *ngIf="viewMode() === 'user'">
        <app-user-my-apps *ngIf="activeTab() === 'my-apps' || activeTab() === 'overview'"></app-user-my-apps>
        <app-user-security *ngIf="activeTab() === 'user-security'"></app-user-security>
        <app-user-network *ngIf="activeTab() === 'user-network'"></app-user-network>
        <app-user-ssh *ngIf="activeTab() === 'user-ssh'"></app-user-ssh>
        <app-user-activity *ngIf="activeTab() === 'user-activity'"></app-user-activity>
        <app-user-devices *ngIf="activeTab() === 'user-devices'"></app-user-devices>
      </div>
    </main>
  </div>
</div>
